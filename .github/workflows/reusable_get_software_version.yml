name: "♻️ Get software version"

on:
  workflow_call:
    inputs:
      update_mode:
        type: string
        required: true
        description: Update mode (major, minor, patch, none)
      is_dev:
        type: boolean
        required: false
        description: True if the build is for development
        default: false
    outputs:
      VERSION:
        description: Version string
        value: ${{ jobs.get_software_version.outputs.VERSION }}

concurrency: get-software-version

jobs:
  get_software_version:
    name: Get software version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      IS_DEV: ${{ inputs.is_dev }}
    outputs:
      VERSION: ${{ steps.version-info.outputs.resolved_version }}
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: version-info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep the release a draft: with immutable releases, assets can only be attached
          # before publishing. reusable_publish_release.yml publishes it after the uploads.
          publish: false
          commitish: "${{ github.event.pull_request.head.sha || github.sha }}"
          prerelease: ${{ env.IS_DEV }}
          prerelease-identifier: ${{ inputs.is_dev && 'alpha' || '' }}

      - name: Report build info summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          |VERSION|
          |:--:|
          |\`$VERSION\`
          EOF
        env:
          VERSION: ${{ steps.version-info.outputs.resolved_version }}
