name: "♻️ Test"

on:
  workflow_call:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Test
        run: mise run test

      - name: Lint
        run: mise run lint
